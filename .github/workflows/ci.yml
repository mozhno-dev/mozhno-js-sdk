name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  conformance:
    name: Conformance (shared specs)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fetch SDK specifications
        run: git clone --depth 1 https://github.com/mozhno-dev/mozhno.git /tmp/mozhno-specs
      - run: npm ci
      - name: Run conformance
        run: npm test
        env:
          SPECS_DIR: /tmp/mozhno-specs/sdk-tests/specifications

  e2e:
    name: E2E (browser)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:e2e

  smoke:
    name: Package smoke (npm pack + TS consumer)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Pack and smoke-test ESM/CJS imports
        run: |
          TARBALL_PATH="$GITHUB_WORKSPACE/$(npm pack --silent)"
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$TARBALL_PATH" --silent
          cat > main.mjs <<EOF
          import { MozhnoClient } from '@mozhno/client-js';
          const client = new MozhnoClient({ url: 'http://localhost:9999', clientKey: 'k', appName: 'smoke', mode: 'server', refreshInterval: 0 });
          console.log('esm ok', client.isEnabled('x'));
          client.stop();
          EOF
          cat > main.cjs <<EOF
          const { MozhnoClient } = require('@mozhno/client-js');
          const client = new MozhnoClient({ url: 'http://localhost:9999', clientKey: 'k', appName: 'smoke', mode: 'server', refreshInterval: 0 });
          console.log('cjs ok', client.isEnabled('x'));
          client.stop();
          EOF
          node main.mjs
          node main.cjs

      - name: TypeScript consumer typecheck
        run: |
          cd /tmp/consumer
          npm install typescript @types/node --silent
          cat > consumer.ts <<EOF
          import { MozhnoClient } from '@mozhno/client-js';
          const client = new MozhnoClient({ url: 'http://localhost:9999', clientKey: 'k', appName: 'smoke', mode: 'client' });
          client.isEnabled('x');
          EOF
          npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext consumer.ts

  publish:
    name: Publish to npm
    needs: [lint, test, conformance, e2e, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci && npm run build && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
