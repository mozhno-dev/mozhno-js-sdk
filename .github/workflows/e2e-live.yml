name: E2E live

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  live-from-source:
    name: Live E2E (server from source)
    runs-on: ubuntu-latest
    env:
      LIVE_URL: http://localhost:8080
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: feature_flags
          POSTGRES_USER: flags_user
          POSTGRES_PASSWORD: flags_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flags_user -d feature_flags"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build

      - name: Checkout mozhno (server source)
        uses: actions/checkout@v4
        with:
          repository: mozhno-dev/mozhno
          path: mozhno

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Build server jar
        run: ./gradlew :mozhno-app:bootJar --no-daemon
        working-directory: mozhno/server

      - name: Start server
        working-directory: mozhno/server
        run: |
          nohup java -jar mozhno-app/build/libs/*.jar > server.log 2>&1 &
          echo $! > server.pid
        env:
          MOZHNO_DB_URL: jdbc:postgresql://localhost:5432/feature_flags
          MOZHNO_DB_USERNAME: flags_user
          MOZHNO_DB_PASSWORD: flags_password
          MOZHNO_JWT_SECRET: live-e2e-secret-live-e2e-secret-live-e2e-secret-32bytes!
          MOZHNO_INIT_EMAIL: admin@mozhno.dev
          MOZHNO_INIT_PASSWORD: admin
          MOZHNO_BASE_URL: http://localhost:8080
          MOZHNO_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:4173

      - name: Wait for server
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:9090/actuator/health; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server did not start"
          cat mozhno/server/server.log || true
          exit 1

      - name: Run live E2E
        run: npm run test:e2e:live

      - name: Checkout mozhno-java-sdk (live integration)
        uses: actions/checkout@v4
        with:
          repository: mozhno-dev/mozhno-java-sdk
          path: java-sdk

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Run Java live integration
        working-directory: java-sdk
        run: ./gradlew test --tests "dev.mozhno.sdk.LiveIntegrationTest"
        env:
          LIVE_ENV_FILE: ${{ github.workspace }}/test/e2e-live/env.json

  live-latest:
    name: Live E2E (mozhno:latest, nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build

      - name: Checkout mozhno (docker-compose)
        uses: actions/checkout@v4
        with:
          repository: mozhno-dev/mozhno
          path: mozhno

      - name: Start stack (mozhno:latest)
        working-directory: mozhno
        run: docker compose up -d
        env:
          MOZHNO_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:4173

      - name: Wait for server
        run: |
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:9090/actuator/health; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          docker compose -f mozhno/docker-compose.yml logs mozhno || true
          exit 1

      - name: Run live E2E
        run: npm run test:e2e:live

      - name: Teardown
        if: always()
        working-directory: mozhno
        run: docker compose down -v
